name: Runner retry

# GitHub ends a job that no hosted runner took after its acquisition attempts,
# as when macOS runners run short, and the job runs no step. This workflow
# re-runs such a run's failed jobs and their dependents once, as a manual
# re-run of the failed jobs does. runner_retry.py decides: a run with any other
# failure or cancellation, or whose ref has moved on, stays as it is.
on:
  workflow_run:
    workflows: ["Build & Test", "Release"]
    types: [completed]

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  retry:
    if: github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # Lists the run's jobs and re-runs them. No other workflow holds it.
      actions: write
      # Reads each job's annotations.
      checks: read
      # Checks out the script and reads the run's ref.
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # The default branch, which holds this workflow, not the run's head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Decide whether no runner took the failed jobs
        id: decide
        run: python3 -B .github/scripts/runner_retry.py

      - name: Re-run the failed jobs
        if: steps.decide.outputs.retry == 'true'
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/rerun-failed-jobs"
