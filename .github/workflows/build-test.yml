name: Build & Test

on:
  push:
    branches: ["**"]
    # The Examples workflow covers examples/. A workflow skipped by path
    # filters reports no checks, so none of its jobs can be a required check.
    paths-ignore:
      - "**.md"
      - "**.png"
      - "examples/**"
  # release.yml runs these checks on a release's commit.
  workflow_call: {}

permissions:
  contents: read

concurrency:
  # Each main run gets a group of its own, so a later merge cancels neither a
  # running nor a pending main run. In a workflow that calls this one,
  # github.workflow is the caller's name, so the group names this workflow too.
  group: ${{ github.workflow }}-build-test-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build-test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    # Above go test's own 10m timeout, which prints the goroutines of a hung test.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # go.mod sets the oldest Go that builds artifact-fs, and stable the newest.
        # Only go.mod runs modernize and the hook smoke test: neither depends on
        # the Go release, and a newer Go can break the pinned x/tools.
        go: [go.mod, stable]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go == 'stable' && 'stable' || '' }}
          go-version-file: ${{ matrix.go == 'go.mod' && 'go.mod' || '' }}

      - name: Check modernize
        if: matrix.go == 'go.mod'
        run: |
          go run golang.org/x/tools/go/analysis/passes/modernize/cmd/modernize@v0.52.0 -fix ./...
          git diff --exit-code

      - name: Build
        run: go build ./cmd/artifact-fs ./cmd/slimtree

      - name: Vet
        run: go vet ./...

      # setup-go restores Go's test cache, so -count=1 makes each run execute the tests.
      - name: Test
        run: go test -race -count=1 ./...

      - name: Pre-commit hook on Linux
        if: matrix.go == 'go.mod'
        run: |
          printf '\n// pre-commit hook smoke test\n' >> internal/model/types.go
          git add internal/model/types.go
          .githooks/pre-commit

  # Runs the package tests on macOS, including the darwin-only files, without mounting.
  darwin-test:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      # setup-go restores Go's test cache, so -count=1 makes each run execute the tests.
      # go test also compiles cmd/artifact-fs, which has no tests.
      - name: Test
        run: go test -race -count=1 ./...

  fuse-e2e:
    name: fuse-e2e (${{ matrix.user }})
    runs-on: ubuntu-24.04
    # The suite's watchdog ends a hung run about 22.5 min after the suite
    # starts, which is 20 s to 66 s into the job, so about 23.6 min into the
    # job at worst. Raise this timeout with a longer suite -test.timeout or a
    # new step before the suite.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # As non-root, the mount goes through the setuid fusermount3, as a
        # user's mount does.
        user: [root, non-root]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up FUSE
        run: |
          sudo apt-get update
          sudo apt-get install --yes fuse3
          if [ ! -e /dev/fuse ]; then
            sudo modprobe fuse
          fi
          test -c /dev/fuse
          ls -l /dev/fuse
          sudo chmod 666 /dev/fuse

      - name: Show the non-root mount setup
        if: matrix.user == 'non-root'
        run: |
          id
          ls -l "$(command -v fusermount3)"
          fusermount3 -V
          # artifact-fs mounts without allow_other, so fusermount3 needs no
          # user_allow_other here.
          grep -v '^#' /etc/fuse.conf || true

      - name: SSH wrapper owner check as root
        if: matrix.user == 'root'
        run: |
          set -o pipefail
          # Only root can give the SSH wrapper's directory another owner, so
          # only this job runs that subtest.
          go test -c -o "$RUNNER_TEMP/gitstore.test" ./internal/gitstore
          sudo "$RUNNER_TEMP/gitstore.test" \
            -test.count=1 \
            -test.run '^TestSSHWrapperIsReusedOnlyWhilePrivate$' \
            -test.timeout=2m \
            -test.v | tee "$RUNNER_TEMP/gitstore-root.log"
          grep -q -- '--- PASS: TestSSHWrapperIsReusedOnlyWhilePrivate/directory_owner' "$RUNNER_TEMP/gitstore-root.log"

      - name: FUSE end-to-end tests
        env:
          AFS_RUN_E2E_TESTS: "1"
        run: |
          # The daemon runs inside the test binary, so -race covers it under kernel load.
          go test -race -c -o "$RUNNER_TEMP/artifact-fs-e2e.test" .
          # TestE2ESlimtreeLifecycle drives this binary. The root run has no go on PATH to build it.
          go build -o "$RUNNER_TEMP/slimtree" ./cmd/slimtree
          export AFS_E2E_SLIMTREE="$RUNNER_TEMP/slimtree"
          as_user=()
          if [ "${{ matrix.user }}" = root ]; then
            as_user=(sudo --preserve-env=AFS_RUN_E2E_TESTS,AFS_E2E_SLIMTREE)
          fi
          # A hang can stop the binary's -test.timeout panic from printing, so a
          # watchdog dumps every goroutine a minute after that timeout.
          "${as_user[@]}" .github/scripts/run-with-hang-dump.sh 180 "$RUNNER_TEMP/artifact-fs-e2e.test" \
            -test.count=1 \
            -test.run '^TestFUSEMountSmoke$' \
            -test.timeout=2m \
            -test.v
          "${as_user[@]}" .github/scripts/run-with-hang-dump.sh 1260 "$RUNNER_TEMP/artifact-fs-e2e.test" \
            -test.count=1 \
            -test.run '^TestE2E' \
            -test.timeout=20m \
            -test.v

  # A failing fuzz run uploads only the ciphertext of its inputs. This job fails
  # one on a planted input and checks its upload. seal-fuzz-inputs-log checks
  # its log.
  seal-fuzz-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      # The planted input holds a string that no file of the repository holds
      # and no step prints, so any copy of it in an upload or the log leaked.
      - name: Plant a failing fuzz input
        id: plant
        working-directory: ${{ runner.temp }}
        run: |
          ssh-keygen -q -t ed25519 -N '' -C '' -f key
          # FUZZ_AGE_RECIPIENT holds a key without a comment.
          echo "recipient=$(cut -d' ' -f1,2 key.pub)" >>"$GITHUB_OUTPUT"
          mkdir -p plant/testdata/fuzz/FuzzPlanted
          cd plant
          go mod init plant
          cat >plant_test.go <<'EOF'
          package plant

          import "testing"

          // Fails on every input and shows it, as a failure of redaction does.
          func FuzzPlanted(f *testing.F) {
            f.Fuzz(func(t *testing.T, s string) { t.Fatalf("leaked %q", s) })
          }
          EOF
          # seal-fuzz-inputs-log derives the same string.
          marker=$(echo "planted-$GITHUB_RUN_ID" | sha256sum | cut -c1-32)
          printf 'go test fuzz v1\nstring("%s")\n' "$marker" >testdata/fuzz/FuzzPlanted/planted

      - name: Fuzz the planted input
        id: fuzz
        continue-on-error: true
        working-directory: ${{ runner.temp }}/plant
        run: '"$GITHUB_WORKSPACE/.github/scripts/fuzz.sh" . FuzzPlanted 10s'

      - name: Check that the planted input failed the run
        env:
          FUZZ_OUTCOME: ${{ steps.fuzz.outcome }}
        run: test "$FUZZ_OUTCOME" = failure

      - name: Seal the fuzz inputs
        uses: ./.github/actions/seal-fuzz-inputs
        with:
          corpus: ${{ runner.temp }}/plant/testdata/fuzz
          recipient: ${{ steps.plant.outputs.recipient }}
          artifact: planted-fuzz-inputs

      - name: Seal the fuzz inputs without a recipient
        uses: ./.github/actions/seal-fuzz-inputs
        with:
          corpus: ${{ runner.temp }}/plant/testdata/fuzz
          artifact: unsealed-fuzz-inputs

      - name: Download the upload
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: planted-fuzz-inputs
          path: ${{ runner.temp }}/uploaded

      - name: Check that the upload is only ciphertext
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          planted=plant/testdata/fuzz/FuzzPlanted/planted
          marker=$(sed -n 's/^string("\(.*\)")$/\1/p' "$planted")
          test -n "$marker"
          test "$(find uploaded -type f)" = uploaded/planted-fuzz-inputs.tar.age
          if grep -rqF "$marker" uploaded; then
            echo "::error::The upload holds the planted input."
            exit 1
          fi
          mkdir recovered
          age -d -i key uploaded/planted-fuzz-inputs.tar.age | tar -x -C recovered
          cmp "$planted" recovered/FuzzPlanted/planted

  # A job's log is readable only once the job ends.
  seal-fuzz-inputs-log:
    needs: seal-fuzz-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Check seal-fuzz-inputs' log and uploads
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          # A calling workflow prefixes the name with the name of its own job.
          job=$(gh api "$run/jobs?filter=latest" --paginate \
            --jq '.jobs[] | select(.name == "seal-fuzz-inputs" or (.name | endswith(" / seal-fuzz-inputs"))) | .id')
          # The log can trail the job's end. It holds the escape sequences of
          # colored output.
          for _ in 1 2 3 4 5; do
            gh api --allow-escape-sequences "repos/$GITHUB_REPOSITORY/actions/jobs/$job/logs" >log && break
            sleep 15
          done
          if ! grep -qF -- '--- FAIL: FuzzPlanted' log; then
            echo "::error::Found no log of seal-fuzz-inputs' failing fuzz run."
            exit 1
          fi
          grep -qF '##[warning]FUZZ_AGE_RECIPIENT is not set, so no fuzz inputs were uploaded.' log
          marker=$(echo "planted-$GITHUB_RUN_ID" | sha256sum | cut -c1-32)
          if grep -qF "$marker" log; then
            echo "::error::seal-fuzz-inputs' log shows the planted input."
            exit 1
          fi
          uploads=$(gh api "$run/artifacts" --paginate --jq '.artifacts[].name')
          grep -qx planted-fuzz-inputs <<<"$uploads"
          if grep -qx unsealed-fuzz-inputs <<<"$uploads"; then
            echo "::error::The seal without a recipient uploaded the fuzz inputs."
            exit 1
          fi
