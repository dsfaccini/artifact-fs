name: Build & Test

on:
  push:
    branches: ["**"]
    # The Examples workflow covers examples/. A workflow skipped by path
    # filters reports no checks, so none of its jobs can be a required check.
    paths-ignore:
      - "**.md"
      - "**.png"
      - "examples/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check modernize
        run: |
          go run golang.org/x/tools/go/analysis/passes/modernize/cmd/modernize@v0.52.0 -fix ./...
          git diff --exit-code

      - name: Build
        run: go build ./cmd/artifact-fs

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  darwin-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet
        run: GOOS=darwin go vet ./...

      - name: Build
        run: GOOS=darwin go build -o /dev/null ./cmd/artifact-fs

  fuse-e2e:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up FUSE
        run: |
          sudo apt-get update
          sudo apt-get install --yes fuse3
          if [ ! -e /dev/fuse ]; then
            sudo modprobe fuse
          fi
          test -c /dev/fuse
          sudo chmod 666 /dev/fuse

      - name: FUSE end-to-end tests
        env:
          AFS_RUN_E2E_TESTS: "1"
        run: |
          go test -c -o "$RUNNER_TEMP/artifact-fs-e2e.test" .
          sudo --preserve-env=AFS_RUN_E2E_TESTS "$RUNNER_TEMP/artifact-fs-e2e.test" \
            -test.count=1 \
            -test.run '^TestFUSEMountSmoke$' \
            -test.timeout=2m \
            -test.v
          sudo --preserve-env=AFS_RUN_E2E_TESTS "$RUNNER_TEMP/artifact-fs-e2e.test" \
            -test.count=1 \
            -test.run '^TestE2E' \
            -test.timeout=20m \
            -test.v
