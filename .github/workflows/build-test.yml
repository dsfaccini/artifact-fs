name: Build & Test

on:
  push:
    branches: ["**"]
    # The Examples workflow covers examples/. A workflow skipped by path
    # filters reports no checks, so none of its jobs can be a required check.
    paths-ignore:
      - "**.md"
      - "**.png"
      - "examples/**"

permissions:
  contents: read

concurrency:
  # Each main run gets a group of its own, so a later merge cancels neither a
  # running nor a pending main run.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build-test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    # Above go test's own 10m timeout, which prints the goroutines of a hung test.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # go.mod sets the oldest Go that builds artifact-fs, and stable the newest.
        # Only go.mod runs modernize and the hook smoke test: neither depends on
        # the Go release, and a newer Go can break the pinned x/tools.
        go: [go.mod, stable]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go == 'stable' && 'stable' || '' }}
          go-version-file: ${{ matrix.go == 'go.mod' && 'go.mod' || '' }}

      - name: Check modernize
        if: matrix.go == 'go.mod'
        run: |
          go run golang.org/x/tools/go/analysis/passes/modernize/cmd/modernize@v0.52.0 -fix ./...
          git diff --exit-code

      - name: Build
        run: go build ./cmd/artifact-fs

      - name: Vet
        run: go vet ./...

      # setup-go restores Go's test cache, so -count=1 makes each run execute the tests.
      - name: Test
        run: go test -race -count=1 ./...

      - name: Pre-commit hook on Linux
        if: matrix.go == 'go.mod'
        run: |
          printf '\n// pre-commit hook smoke test\n' >> internal/model/types.go
          git add internal/model/types.go
          .githooks/pre-commit

  # Runs the package tests on macOS, including the darwin-only files, without mounting.
  darwin-test:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      # setup-go restores Go's test cache, so -count=1 makes each run execute the tests.
      # go test also compiles cmd/artifact-fs, which has no tests.
      - name: Test
        run: go test -race -count=1 ./...

  fuse-e2e:
    name: fuse-e2e (${{ matrix.user }}, ${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # As non-root, the mount goes through the setuid fusermount3, as a
        # user's mount does.
        user: [root, non-root]
        # TEMPORARY: hang demos and GitConcurrentReads repro shards.
        mode: [repro-1, repro-2, repro-3, repro-4, repro-5, repro-6]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up FUSE
        run: |
          sudo apt-get update
          sudo apt-get install --yes fuse3
          if [ ! -e /dev/fuse ]; then
            sudo modprobe fuse
          fi
          test -c /dev/fuse
          ls -l /dev/fuse
          sudo chmod 666 /dev/fuse

      - name: Show the non-root mount setup
        if: matrix.user == 'non-root'
        run: |
          id
          ls -l "$(command -v fusermount3)"
          fusermount3 -V
          # artifact-fs mounts without allow_other, so fusermount3 needs no
          # user_allow_other here.
          grep -v '^#' /etc/fuse.conf || true

      - name: SSH wrapper owner check as root
        if: matrix.user == 'root'
        run: |
          set -o pipefail
          # Only root can give the SSH wrapper's directory another owner, so
          # only this job runs that subtest.
          go test -c -o "$RUNNER_TEMP/gitstore.test" ./internal/gitstore
          sudo "$RUNNER_TEMP/gitstore.test" \
            -test.count=1 \
            -test.run '^TestSSHWrapperIsReusedOnlyWhilePrivate$' \
            -test.timeout=2m \
            -test.v | tee "$RUNNER_TEMP/gitstore-root.log"
          grep -q -- '--- PASS: TestSSHWrapperIsReusedOnlyWhilePrivate/directory_owner' "$RUNNER_TEMP/gitstore-root.log"

      - name: FUSE end-to-end tests
        env:
          AFS_RUN_E2E_TESTS: "1"
        run: |
          # The daemon runs inside the test binary, so -race covers it under kernel load.
          go test -race -c -o "$RUNNER_TEMP/artifact-fs-e2e.test" .
          as_user=()
          if [ "${{ matrix.user }}" = root ]; then
            as_user=(sudo --preserve-env=AFS_RUN_E2E_TESTS,AFS_TEMPORARY_HANG)
          fi
          # A hang can stop the binary's -test.timeout panic from printing, so a
          # watchdog dumps every goroutine a minute after that timeout. The job
          # timeout must leave room for both.
          bin=$RUNNER_TEMP/artifact-fs-e2e.test
          case "${{ matrix.mode }}" in
          hang-demo-fast)
            export AFS_TEMPORARY_HANG=1
            "${as_user[@]}" .github/scripts/run-with-hang-dump.sh 120 "$bin" \
              -test.count=1 -test.run '^TestE2ETemporaryHang$' -test.timeout=1m -test.v
            ;;
          hang-demo)
            export AFS_TEMPORARY_HANG=1
            "${as_user[@]}" .github/scripts/run-with-hang-dump.sh 180 "$bin" \
              -test.count=1 -test.run '^TestFUSEMountSmoke$' -test.timeout=2m -test.v
            "${as_user[@]}" .github/scripts/run-with-hang-dump.sh 1260 "$bin" \
              -test.count=1 -test.run '^TestE2ETemporaryHang$' -test.timeout=20m -test.v
            ;;
          repro-*)
            "${as_user[@]}" .github/scripts/run-with-hang-dump.sh 660 "$bin" \
              -test.count=60 -test.run '^TestE2ESharedMount$/^(GitCleanState|GitConcurrentReads)$' -test.timeout=10m -test.v
            ;;
          esac
