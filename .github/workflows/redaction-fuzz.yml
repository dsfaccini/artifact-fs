name: Redaction fuzz

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}
  # release.yml fuzzes each release's commit before it publishes.
  workflow_call: {}

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # A saved cache would publish the fuzzer's inputs under GOCACHE.
          # This job also shares build-test's cache key, and saving that key
          # first would leave build-test a cache without its build output.
          cache: false

      # The log is public, so it shows only the fuzzer's progress and the verdict.
      - name: Fuzz redaction
        id: fuzz
        run: .github/scripts/fuzz.sh ./internal/auth FuzzRedactionHidesPassword 10m

      # A failing input can show a secret that redaction missed, so only its
      # ciphertext leaves the runner. Decrypt it with
      # age -d -i <private key> fuzz-inputs.tar.age | tar -x.
      - name: Seal the fuzz inputs
        if: failure() && steps.fuzz.outcome == 'failure'
        uses: ./.github/actions/seal-fuzz-inputs
        with:
          corpus: internal/auth/testdata/fuzz
          recipient: ${{ vars.FUZZ_AGE_RECIPIENT }}
          artifact: fuzz-inputs
