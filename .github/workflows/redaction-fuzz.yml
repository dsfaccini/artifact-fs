name: Redaction fuzz

on:
  schedule:
    - cron: '0 3 * * *'
  push:
    # A version tag, such as 1.0.0-rc.10 or v1.2.3.
    tags: ["[0-9]*", "v[0-9]*"]
  # A release made from a tag that already exists pushes no tag.
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # This job shares build-test's cache key. Saving that key first would
          # leave build-test a cache without its build output.
          cache: false

      - name: Fuzz redaction
        env:
          FUZZ_TARGET: FuzzRedactionHidesPassword
        run: |
          status=0
          go test -run '^$' -fuzz "^$FUZZ_TARGET\$" -fuzztime 10m ./internal/auth \
            >"$RUNNER_TEMP/fuzz.log" 2>&1 || status=$?
          # A failure message shows the input that leaked, and this log is
          # public. Print only the fuzzer's progress and the verdict.
          grep -E '^(fuzz: |--- FAIL|FAIL|ok |PASS$)' "$RUNNER_TEMP/fuzz.log" || true
          if [ "$status" -ne 0 ]; then
            echo "::error::Redaction fuzzing failed. Its input stays out of this public log: rerun go test -fuzz '^$FUZZ_TARGET\$' ./internal/auth locally."
            exit "$status"
          fi
          # go test passes when -fuzz matches no target, as after a rename.
          if ! grep -qE '^fuzz: elapsed: .*execs:' "$RUNNER_TEMP/fuzz.log"; then
            echo "::error::$FUZZ_TARGET did not fuzz. Check that -fuzz names a fuzz test in ./internal/auth."
            exit 1
          fi
