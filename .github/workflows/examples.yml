name: Examples

on:
  push:
    branches-ignore: [main]
    # build-test compiles every Go package, so a branch runs the examples only
    # for a change to what only they check. examples-main.yml runs them on every
    # push to main, which catches a Go change that breaks a container build. A
    # workflow skipped by path filters reports no checks, so none of its jobs
    # can be a required check.
    paths:
      - "examples/**"
      - ".dockerignore"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/examples.yml"
  workflow_call: {}

permissions:
  contents: read

concurrency:
  # Each main run gets a group of its own, so a later merge cancels neither a
  # running nor a pending main run.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  container-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: examples/cloudflare-sandbox-sdk/package-lock.json

      - name: Check example documentation
        run: |
          test "$(wc -l < examples/README.md)" -lt 50
          test "$(wc -l < examples/cloudflare-sandbox-sdk/README.md)" -lt 50

      - name: Check Sandbox bootstrap lock lifetime
        run: bash examples/cloudflare-sandbox-sdk/tests/mount-lock.test.sh

      - name: Check Sandbox remote validation
        run: bash examples/cloudflare-sandbox-sdk/tests/validate-remote.test.sh

      - name: Build generic container
        run: docker build --file examples/Dockerfile .

      - name: Check Cloudflare Sandbox example
        working-directory: examples/cloudflare-sandbox-sdk
        run: |
          npm ci
          npm run typecheck
          package_version="$(node -p "require('./package.json').devDependencies['@cloudflare/sandbox']")"
          image_version="$(sed -n 's#^FROM docker.io/cloudflare/sandbox:\([^ ]*\) AS sandbox-sdk$#\1#p' Dockerfile)"
          test "$package_version" = "$image_version"
          npx wrangler deploy --dry-run --outdir /tmp/artifact-fs-sandbox-dry-run
